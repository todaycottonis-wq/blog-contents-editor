<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog Screenshot Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gothic+A1:wght@300;400;500;700&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#f3f3f6;--panel:#fff;--line:#e9e9ee;--ink:#111114;--mute:#85858f;--acc:#6d4aff;--accsoft:#efeaff;--danger:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:68px 1fr;height:100%}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px}
.tl{display:flex;align-items:baseline;gap:12px;min-width:0}
.ttl{font-size:20px;font-weight:700;border:0;background:transparent;outline:none;width:min(36vw,420px);padding:4px 6px;border-radius:8px;letter-spacing:-.3px}
.ttl:focus{background:#fff}
.saved{color:var(--mute);font-size:12px;white-space:nowrap}
.saved.warn{color:var(--danger)}
.tr{display:flex;align-items:center;gap:10px}
.tr input[type=range]{width:120px}
#zv{width:38px;color:var(--mute);font-variant-numeric:tabular-nums}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1}
.ic:disabled{opacity:.35;cursor:default}
.pill{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:500;white-space:nowrap}
.pill:hover{border-color:#cfcfd8}
.pill.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.dd{position:relative}
.menu{position:absolute;right:0;top:44px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;min-width:200px;box-shadow:0 12px 32px rgba(20,20,40,.14)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px}
.menu button:hover{background:var(--bg)}

.main{display:grid;grid-template-columns:268px minmax(0,1fr) 340px;gap:14px;padding:0 14px 14px;min-height:0}
.left,.right{background:var(--panel);border-radius:24px;overflow:auto;padding:16px}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px}

.lh{font-weight:700;margin:2px 4px 12px;display:flex;justify-content:space-between}
.lh span{color:var(--mute);font-weight:400}
.pitem{position:relative;border:2px solid transparent;border-radius:16px;padding:8px;margin-bottom:10px;background:#fafafc;cursor:pointer}
.pitem.on{border-color:var(--acc);background:#fff}
.pitem.over .tw{outline:3px solid var(--danger)}
.pnum{position:absolute;left:14px;top:14px;z-index:3;font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.tw{position:relative;width:212px;height:265px;overflow:hidden;border-radius:8px;background:#fff;border:1px solid var(--line)}
.sb{position:absolute;left:0;top:0;transform:scale(.19630);transform-origin:0 0;pointer-events:none}
.pact{position:absolute;right:12px;top:12px;z-index:3;display:none;gap:4px}
.pitem:hover .pact{display:flex}
.pact button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;padding:0}
.pact button:hover{background:var(--bg)}
.padd{position:relative}
#padd{width:100%;height:64px;border:2px dashed #d5d5de;border-radius:16px;background:none;font-size:26px;color:var(--mute)}
#padd:hover{border-color:var(--acc);color:var(--acc)}
#pmenu{position:absolute;left:0;right:0;bottom:70px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(20,20,40,.14);z-index:20}
#pmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px}
#pmenu button:hover{background:var(--bg)}
#pmenu small{display:block;color:var(--mute)}

.stage{flex:1;min-height:0;overflow:auto;display:flex;background:#e9e9ef;border-radius:24px}
.scaler{position:relative;flex:none;margin:auto;box-shadow:0 10px 40px rgba(20,20,50,.14);background:#fff}
.scaler>.page{position:absolute;left:0;top:0;transform-origin:0 0}
.tbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:8px 12px}
.tbar .tl2{color:var(--mute);font-size:12px;margin-right:6px}
.tbar .grp{display:flex;gap:2px;align-items:center}
.tbar .sep{width:1px;height:22px;background:var(--line);margin:0 8px}
.tbar .sp{flex:1}
.tbar button{height:34px;padding:0 12px;border-radius:10px;border:0;background:transparent;font-size:13px;font-weight:500;white-space:nowrap}
.tbar button:hover{background:var(--accsoft);color:var(--acc)}
.ovf{background:#fff0f0;color:var(--danger);border:1px solid #ffd2d4;border-radius:16px;height:30px;line-height:28px;padding:0 12px;font-size:12.5px;font-weight:500;white-space:nowrap}

.ps{padding:14px 4px 16px;border-bottom:1px solid var(--line)}
.ps:last-child{border-bottom:0}
.ps h4{margin:0 0 12px;font-size:13px}
.row{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin-bottom:10px}
.row>label{color:var(--mute);font-size:12.5px}
.rc{display:flex;align-items:center;gap:8px;min-width:0}
.rc input[type=range]{flex:1;min-width:0}
.num{width:58px;height:32px;border:1px solid var(--line);border-radius:9px;padding:0 6px;text-align:right;background:#fff}
.rc input[type=text],.rc select{width:100%;height:34px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.rc input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:9px;padding:2px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 2px;font-size:12px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg.full{width:100%}.seg.full button{flex:1}
.acts{display:flex;gap:6px}
.acts button{flex:1;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px}
.acts button:hover{background:var(--bg)}
.acts button.del:hover{background:#fff0f0;color:var(--danger);border-color:#ffd2d4}
.fmt{display:flex;gap:6px;align-items:center}
.fmt button{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:14px;padding:0}
.hint{color:var(--mute);font-size:12.5px;line-height:1.6;padding:14px 4px}
.wide{width:100%;height:36px;border-radius:10px;border:1px dashed #cfcfda;background:#fafafc}
.wide:hover{border-color:var(--acc);color:var(--acc)}

.modal{position:fixed;inset:0;background:rgba(15,15,25,.42);display:flex;align-items:center;justify-content:center;z-index:100}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:22px;padding:24px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 12px;font-size:18px}
.mbox ul{margin:0;padding-left:18px;line-height:1.8}
.mbox p{margin:0;line-height:1.7}
.macts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}
.toast.on{opacity:1}

/* ===== 결과 이미지(1080x1350) = 블로그 카드 ===== */
.page{width:1080px;height:1350px;position:relative;overflow:hidden;color:#111;line-height:1.5}
.page *{box-sizing:border-box}
.card{position:absolute;background:#fff;overflow:hidden;transform-origin:0 0}
.hdr{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 38px;background:#fff;border-bottom:1.5px solid #e8e8ea}
.hl,.hr{width:150px;display:flex;align-items:center}
.hr{justify-content:flex-end;gap:24px}
.hc{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 10px}
.hdr svg{width:36px;height:36px;fill:none;stroke:#111;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hc svg{width:33px;height:33px}
.hname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.6px;color:#111}
.content{position:absolute;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column}
.inner{position:relative;flex:none}
.blk{position:relative}
.tx{outline:none;min-height:1em;word-break:keep-all;overflow-wrap:break-word}
.tx b,.tx strong{font-weight:700}
.tx>div+div{margin-top:var(--ps,0px)}
.b-quote .tx{border-left:5px solid #d8d8de;padding-left:22px}
.page.edit .tx:empty::before{content:attr(data-ph);color:#c6c6cc}
.page.edit .hdr{cursor:pointer}
.page.edit .hdr.sel{outline:5px solid var(--acc);outline-offset:-5px}
.page.edit .blk{cursor:text}
.page.edit .blk:hover{outline:3px dashed rgba(109,74,255,.35);outline-offset:5px}
.page.edit .blk.sel{outline:5px solid var(--acc);outline-offset:5px}
.imgw{display:flex}
.imgbox{position:relative;overflow:hidden;background:#ececf0}
.imgbox img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9a9aa6;font-size:22px;cursor:pointer;border:3px dashed #cfcfd8}
.ph b{font-size:44px;font-weight:400;line-height:1}
.imgbox.drop{outline:6px solid var(--acc)}
.prof{display:flex;align-items:center;gap:20px;padding-bottom:24px;border-bottom:1.5px solid #ececee}
.av{width:90px;height:90px;border-radius:50%;background:#e8e8ec;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.av svg{width:66px;height:66px;fill:#b8b8c2}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.page.edit .av{cursor:pointer}
.pm{flex:1;min-width:0}
.pn{font-size:29px;color:#777;letter-spacing:-.4px;line-height:1.3}
.pt{font-size:23px;color:#a8a8b0;letter-spacing:-.2px;line-height:1.4}
.pst{display:flex;align-items:center;gap:8px;border:1.5px solid #dcdce0;padding:9px 17px;font-size:21px;color:#666}
.pst svg{width:25px;height:25px;fill:none;stroke:#666;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;flex-direction:column;gap:5px;padding:0 8px}
.dots i{width:5px;height:5px;border-radius:50%;background:#555;display:block}
.divl{width:100%}

/* ===== 질문답변형 / 사전형 ===== */
.qrow{display:flex;align-items:flex-start;gap:14px}
.qrow .tx{flex:0 1 auto;min-width:1em}
.qic0,.qbadge0{display:flex;align-items:center;flex:none}
.qic{stroke:#2fb5a3;fill:none;stroke-linecap:round}
.qbadge{background:#a8b1c2;color:#fff;font-weight:700;border-radius:8px;padding:0 12px;font-size:.62em;line-height:1.7;letter-spacing:0}
.sd{font-style:normal;margin:0 .4em;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chip{padding:.2em .55em;border-radius:6px;line-height:1.5;letter-spacing:-.4px}
.chip.emp{opacity:.4}
.qa{display:flex;align-items:center;gap:56px}
.qa .it{display:flex;align-items:center;gap:14px}
.qa svg{width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.qa .dots{margin-left:auto}.qa .dots i{background:#bbb}
.drow{display:flex;gap:.45em}.dnum{flex:none;font-weight:700}
.b-dex{margin-left:1.6em}
.b-dex .tx{border-left:6px solid #e3e7ef;padding-left:20px}
.b-dlink .tx:not(:empty)::before{content:'→ '}
.dpill{display:inline-block;border:2px solid;border-radius:999px;padding:1px 16px;line-height:1.5}
.dpr{margin-bottom:14px}
.dhdr{position:absolute;left:0;right:0;top:0;background:#10286b;color:#fff;display:flex;flex-direction:column}
.dhdr svg{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dt{height:70px;display:flex;align-items:center;justify-content:flex-end;padding:0 34px;flex:none}
.dt svg{width:38px;height:38px}.dtt{font-size:31px;font-weight:700;letter-spacing:-.5px}
.ds{height:76px;margin:0 30px;border-radius:38px;background:#fff;display:flex;align-items:center;padding:0 24px 0 32px;gap:16px;flex:none}
.dq{flex:1;min-width:0;font-size:27px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.5px}.dq.ph0{color:#aaa}
.ds svg{width:34px;height:34px;stroke:#556;flex:none}.ds svg.xc{stroke:#bbb}
.di{height:94px;display:flex;justify-content:space-around;align-items:center;padding:0 60px;flex:none}.di svg{width:40px;height:40px}
.dtabs{height:72px;flex:none;background:#fff;display:flex;align-items:stretch;padding-left:34px;gap:34px;overflow:hidden;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.08);color:#999;font-size:25px;font-weight:500}
.dtabs span{display:flex;align-items:center;flex:none}.dtabs span.on{color:#111;font-weight:700;box-shadow:inset 0 -4px 0 #10286b}
.page.edit .dhdr{cursor:pointer}
.page.edit .dhdr.sel{outline:5px solid var(--acc);outline-offset:-5px}
.plat{height:34px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:0 12px;font-weight:500}
.page.edit .b-qacts,.page.edit .b-qdate,.page.edit .b-qmeta,.page.edit .b-qtags,.page.edit .b-dpos{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="tl">
      <input id="ttl" class="ttl" spellcheck="false" aria-label="작업 이름">
      <select id="plat" class="plat" aria-label="형식"><option value="blog">블로그형</option><option value="qna">질문답변형</option><option value="dict">사전형</option></select>
      <span id="saved" class="saved">저장됨 ✓</span><span class="saved" title="작업 내용은 이 브라우저에만 저장돼요. 중요한 작업은 파일로 저장하세요.">· 베타</span>
    </div>
    <div class="tr">
      <input id="zoom" type="range" min="25" max="100" value="50" aria-label="확대 비율"><span id="zv">50%</span>
      <button id="undo" class="ic" data-do="undo" title="실행 취소">↶</button>
      <button id="redo" class="ic" data-do="redo" title="다시 실행">↷</button>
      <div class="dd">
        <button class="pill" data-menu>내 작업 ▾</button>
        <div class="menu" hidden>
          <button data-do="json-save">프로젝트 파일(.json) 저장</button>
          <button data-do="json-load">프로젝트 파일 불러오기</button>
          <button data-do="new-doc">새로 시작</button>
        </div>
      </div>
      <div class="dd">
        <button class="pill dark" data-menu>다운로드 ▾</button>
        <div class="menu" hidden>
          <button data-do="png-current">현재 페이지 PNG (1080×1350)</button>
          <button data-do="png-all">전체 페이지 PNG (ZIP)</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="left">
      <div class="lh">페이지 <span id="pcount"></span></div>
      <div id="plist"></div>
      <div class="padd">
        <button id="padd" aria-label="페이지 추가">+</button>
        <div id="pmenu" hidden>
          <button data-do="add-page" data-v="cover">표지형<small>카테고리 · 제목 · 프로필 · 이미지</small></button>
          <button data-do="add-page" data-v="text">본문형<small>세로 가운데 · 본문</small></button>
          <button data-do="add-page" data-v="mixed">혼합형<small>본문 · 이미지 · 캡션 · 본문</small></button>
        </div>
      </div>
    </aside>

    <section class="center">
      <div class="tbar" id="tbar"></div>
      <div class="stage" id="stage"><div class="scaler" id="scaler"></div></div>
    </section>

    <aside class="right" id="panel"></aside>
  </main>
</div>

<div id="modal" class="modal" hidden><div class="mbox"><h3 id="mt"></h3><div id="mb"></div><div class="macts" id="ma"></div></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="fimg" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="fjson" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(()=>{
'use strict';
const W=1080,H=1350,KEY='bse_proto_v7',PADX=72; /* 논리 px. 결과 이미지(1080) 기준 90px */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* 블로그 카드의 논리 크기(px). 결과 이미지 크기에 맞추려고 scale 만큼 확대 */
const FR={
 '4:5':{w:864,h:1080,scale:1.25,label:'4:5'},
 '1:1':{w:864,h:864,scale:1.25,label:'1:1'},
 '3:4':{w:864,h:1152,scale:.79,label:'3:4 세로'},
 '16:9':{w:1152,h:648,scale:.84,label:'16:9 가로'}
};
/* 결과 이미지 = 블로그 카드 자체(1080x1350, 4:5). 바깥 여백/그림자 없음 */
const FRAME={ratio:'4:5',scale:1.25,shadow:false,bg:'#ffffff'};
const FONTS=[
 {name:'Noto Sans KR',css:'Noto+Sans+KR:wght@300;400;500;700'},
 {name:'Nanum Gothic',css:'Nanum+Gothic:wght@400;700'},
 {name:'Nanum Myeongjo',css:'Nanum+Myeongjo:wght@400;700'},
 {name:'Gothic A1',css:'Gothic+A1:wght@300;400;500;700'},
 {name:'IBM Plex Sans KR',css:'IBM+Plex+Sans+KR:wght@300;400;500;700'}
];
const TEXT=['category','title','heading','paragraph','quote','caption','qtitle','qbody','dword','dlink','ddef','dex','dmore'];
const LBL={category:'카테고리',title:'제목',profile:'프로필',heading:'소제목',paragraph:'본문',quote:'인용문',image:'이미지',caption:'캡션',divider:'구분선',qtitle:'질문 제목',qmeta:'상태줄',qbody:'질문 본문',qtags:'태그',qdate:'날짜·조회수',qacts:'하단 버튼',dword:'표제어',dlink:'연결어',dpos:'품사',ddef:'뜻풀이',dex:'예문',dmore:'더보기'};
const PH={category:'카테고리',title:'제목을 입력하세요',heading:'소제목',paragraph:'본문을 입력하세요',quote:'인용문',caption:'이미지 설명',qtitle:'질문을 입력하세요',qbody:'질문 내용을 입력하세요',dword:'표제어',dlink:'연결어',ddef:'뜻풀이를 입력하세요',dex:'예문',dmore:'국어사전 결과 더보기'};
/* 기본값은 3:4 카드(864x1152) 기준 논리 px. 본문형 레퍼런스: 글자 28 / 행간 약 2.1 / 문단 간격 40 / 자간 -0.02em / 왼쪽 여백 5% */

function sampleImage(a,b){
  const c=document.createElement('canvas');c.width=1400;c.height=900;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1400,900);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,1400,900);
  x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(1000,300,190,0,7);x.fill();
  x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(360,640,260,0,7);x.fill();
  return c.toDataURL('image/jpeg',.9);
}

function renderPage(p,mode){
  const f=doc.frame,d=FR[f.ratio]||FR['3:4'],sc=f.scale,va=p.valign||'center',pf=doc.platform||'blog';
  const pg=document.createElement('div');pg.className='page '+mode;pg.style.background=f.bg;
  pg.style.fontFamily=fstack(UIFONT);
  const card=document.createElement('div');card.className='card';
  Object.assign(card.style,{width:d.w+'px',height:d.h+'px',left:(W-d.w*sc)/2+'px',top:(H-d.h*sc)/2+'px',transform:'scale('+sc+')',boxShadow:f.shadow?'0 26px 70px rgba(20,20,40,.17),0 2px 10px rgba(20,20,40,.06)':'none'});
  let top=0,padTop=64;
  if(pf==='blog'){card.appendChild(hdrEl());top=doc.header.height;padTop=doc.header.gap}
  else if(pf==='dict'){if(p.dictHdr!==false){card.appendChild(dhdrEl());top=DH;padTop=40}else padTop=56}
  const c=document.createElement('div');c.className='content';c.style.top=top+'px';
  const inner=document.createElement('div');inner.className='inner';
  inner.style.padding=(va==='top'?padTop:0)+'px '+PADX+'px 0';
  inner.style.margin=va==='center'?'auto 0':va==='bottom'?'auto 0 '+padTop+'px':'0 0 auto';
  p.blocks.forEach(b=>inner.appendChild(blockEl(b,mode)));
  c.appendChild(inner);card.appendChild(c);pg.appendChild(card);return pg;
}
function pageOverflow(pg){
  const c=pg.querySelector('.content'),inn=c.firstElementChild,last=inn.lastElementChild;
  if(!last)return false;
  const mb=parseFloat(getComputedStyle(last).marginBottom)||0;
  return inn.offsetHeight-mb>c.clientHeight+1;
}

function markSel(){

}

function setImage(file,b,key){key=key||'assetId';
  if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('PNG, JPEG, WebP 이미지만 넣을 수 있어요');return}
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      let url=r.result;const m=Math.max(im.width,im.height);
      if(m>2400){const k=2400/m,c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',.92)}
      const id='a'+uid();assets[id]=url;b[key]=id;renderCanvas();renderThumbs();renderPanel();changed();
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- 블록 / 페이지 조작 ---------- */
function newBlock(t){
  if(t==='qtitle')return nb(t,{html:'',badge:''});
  if(t==='qmeta')return nb(t,{status:'비공개',adopt:''});
  if(t==='qtags')return nb(t,{tags:''});
  if(t==='qdate')return nb(t,{date:'',views:''});
  if(t==='dpos')return nb(t,{pos:'명사',pron:''});
  if(t==='ddef')return nb(t,{html:'',num:'1.'});
  if(TEXT.includes(t))return nb(t,{html:''});
  if(t==='image')return nb(t,{assetId:null});
  if(t==='profile')return nb(t,{nickname:'닉네임',timeLabel:'방금 전',showStats:true});
  return nb(t);
}
function insertBlock(t){
  const p=curPage(),f=st.sel&&st.sel!=='header'?findBlock(st.sel):null,b=newBlock(t);
  const at=f&&f.p===p?f.i+1:p.blocks.length;p.blocks.splice(at,0,b);st.sel=b.id;
  renderCanvas();renderPanel();renderThumbs();changed();
  const tx=scaler.querySelector('.blk[data-id="'+b.id+'"] .tx');if(tx)tx.focus();
  return b;
}
function moveBlock(d){
  const f=findBlock(st.sel);if(!f)return;const j=f.i+d;if(j<0||j>=f.p.blocks.length)return;
  const a=f.p.blocks;[a[f.i],a[j]]=[a[j],a[f.i]];renderCanvas();renderThumbs();changed();
}
function dupBlock(){const f=findBlock(st.sel);if(!f)return;const c=clone(f.b);c.id=uid();f.p.blocks.splice(f.i+1,0,c);st.sel=c.id;renderCanvas();renderPanel();renderThumbs();changed()}
function delBlock(){const f=findBlock(st.sel);if(!f)return;f.p.blocks.splice(f.i,1);st.sel=null;renderCanvas();renderPanel();renderThumbs();changed()}
function platformPage(){
  const pf=doc.platform,ts=pf==='qna'?['qtitle','qmeta','qbody','qtags','qdate','qacts']:['dword','dpos','ddef','dex'];
  return{id:uid(),valign:'center',blocks:ts.map(newBlock)};
}
function presetPage(t){
  if((doc.platform||'blog')!=='blog')return platformPage();
  if(t==='cover')return{id:uid(),valign:'center',blocks:[nb('category',{html:''}),nb('title',{html:''}),nb('profile',{nickname:'닉네임',timeLabel:'방금 전',showStats:true}),nb('image',{assetId:null,style:{mt:24,ar:'16:9'}}),nb('caption',{html:''})]};
  if(t==='text')return{id:uid(),valign:'center',blocks:[nb('paragraph',{html:''})]};
  return{id:uid(),valign:'center',blocks:[nb('paragraph',{html:''}),nb('image',{assetId:null,style:{ar:'4:3'}}),nb('caption',{html:''}),nb('paragraph',{html:''})]};
}
function setPage(i){st.page=i;st.sel=null;renderCanvas();renderPanel();renderThumbs()}
function addPage(t){doc.pages.splice(st.page+1,0,presetPage(t));setPage(st.page+1);changed()}
function movePage(i,d){
  const j=i+d;if(j<0||j>=doc.pages.length)return;const id=curPage().id;
  [doc.pages[i],doc.pages[j]]=[doc.pages[j],doc.pages[i]];st.page=doc.pages.findIndex(p=>p.id===id);renderThumbs();changed();
}
function dupPage(i){const c=clone(doc.pages[i]);c.id=uid();c.blocks.forEach(b=>b.id=uid());doc.pages.splice(i+1,0,c);setPage(i+1);changed()}
function delPage(i){
  if(doc.pages.length<=1){toast('페이지는 최소 1장이 필요해요');return}
  doc.pages.splice(i,1);setPage(Math.min(st.page>i?st.page-1:st.page,doc.pages.length-1));changed();
}
let dragI=null;const plist=$('#plist');
plist.addEventListener('click',e=>{if(e.target.closest('[data-do]'))return;const it=e.target.closest('.pitem');if(it)setPage(+it.dataset.i)});
plist.addEventListener('dragstart',e=>{const it=e.target.closest('.pitem');if(!it)return;dragI=+it.dataset.i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','page')});
plist.addEventListener('dragover',e=>{if(dragI!==null)e.preventDefault()});
plist.addEventListener('drop',e=>{

  if(it){const to=+it.dataset.i;if(to!==dragI){const id=curPage().id,[p]=doc.pages.splice(dragI,1);doc.pages.splice(to,0,p);st.page=doc.pages.findIndex(x=>x.id===id);renderThumbs();changed()}}
  dragI=null;
});
plist.addEventListener('dragend',()=>{dragI=null});

/* ---------- 글 붙여넣기 → 카드 자동 분할 ---------- */
function bulkOpen(){
  modal('글로 한번에 만들기',
   '<p style="color:var(--mute);font-size:13px;margin-bottom:10px">글을 붙여넣으면 카드 크기에 맞춰 페이지를 나눠요. 줄바꿈은 문단이 되고, <b>1.</b> 처럼 숫자로 시작하는 줄이나 <b>#</b> 줄은 굵은 소제목이 돼요. 현재 페이지 뒤에 추가돼요.</p>'+
   '<textarea id="bt" placeholder="여기에 글을 붙여넣으세요" style="width:100%;height:210px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;line-height:1.6;resize:vertical"></textarea>'+
   '<div style="margin-top:12px;line-height:2.1;font-size:13px">'+
   '<label><input type="checkbox" id="bo-cover" checked> 첫 줄을 제목으로 표지 페이지 만들기</label><br>'+
   '<label><input type="checkbox" id="bo-head" checked> 소제목(숫자·#) 줄에서 새 페이지 시작</label><br>'+
   '<label>본문 세로 위치 <select id="bo-va"><option value="center">가운데</option><option value="top">위</option></select></label></div>',
   [{label:'취소'},{label:'만들기',cls:'dark',fn:()=>bulkBuild($('#bt').value,{cover:$('#bo-cover').checked,head:$('#bo-head').checked,valign:$('#bo-va').value})}]);
}
async function bulkBuild(text,opt){
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){toast('글을 먼저 붙여넣어 주세요');return}
  if(text.length>30000){toast('글이 너무 길어요 (3만 자 이하)');return}
  toast('페이지를 나누는 중…');
  const ff=(doc.ts.paragraph&&doc.ts.paragraph.ff)||'Noto Sans KR';
  try{await Promise.all([300,400,500,700].map(w=>document.fonts.load(w+' 28px "'+ff+'"',text)));await document.fonts.ready}catch(e){}
  let titleLine=null;if(opt.cover)titleLine=lines.shift();
  const isH=l=>/^(\d+[.)]\s|#{1,3}\s)/.test(l);
  const toHtml=(l,h)=>h?'<b>'+esc(l.replace(/^#{1,3}\s/,''))+'</b>':esc(l);
  const holderEl=holder();
  const mk=items=>({id:'t',valign:opt.valign,blocks:[nb('paragraph',{html:items.map(x=>'<div>'+x.h+'</div>').join('')})]});
  const fits=items=>{const n=renderPage(mk(items),'export');holderEl.appendChild(n);const o=pageOverflow(n);holderEl.removeChild(n);return !o};
  const pieces=[];
  for(const l of lines){
    const h=isH(l),full=toHtml(l,h);
    if(fits([{h:full}])){pieces.push({h:full,head:h});continue}
    const raw=l.replace(/^#{1,3}\s/,'');
    let toks=raw.split(/(?<=[.!?])\s+/);
    if(toks.some(t=>!fits([{h:esc(t)}])))toks=raw.split(/\s+/);
    let acc='';
    for(const t of toks){
      const next=acc?acc+' '+t:t;
      if(acc&&!fits([{h:esc(next)}])){pieces.push({h:esc(acc),head:false});acc=t}else acc=next;
    }
    if(acc)pieces.push({h:esc(acc),head:false});
  }
  const pages=[];let cur=[];
  const flush=()=>{
    if(!cur.length)return;
    let carry=null;
    if(cur.length>1&&cur[cur.length-1].head)carry=cur.pop();
    pages.push(cur);cur=carry?[carry]:[];
  };
  for(const p of pieces){
    if(p.head&&opt.head&&cur.length){pages.push(cur);cur=[]}
    if(cur.length&&!fits(cur.concat([p])))flush();
    cur.push(p);
  }
  if(cur.length)pages.push(cur);
  const out=[];
  if(titleLine!==null)out.push({id:uid(),valign:'center',blocks:[nb('title',{html:esc(titleLine.replace(/^#{1,3}\s/,'')),style:{mt:28,mb:34}}),nb('profile',{nickname:'닉네임',timeLabel:'방금 전',showStats:true}),nb('image',{assetId:null,style:{mt:24,ar:'4:3'}})]});
  pages.forEach(items=>{const p=mk(items);p.id=uid();out.push(p)});
  doc.pages.splice(st.page+1,0,...out);
  setPage(st.page+1);changed();
  toast(out.length+'장을 추가했어요');
}

/* ---------- 파일 ---------- */
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function saveJson(){download(new Blob([JSON.stringify({doc,assets:usedAssets()})],{type:'application/json'}),(doc.title||'project')+'.json')}
$('#fjson').addEventListener('change',()=>{
  const f=$('#fjson').files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.doc||!Array.isArray(d.doc.pages)||!d.doc.pages.length||!d.doc.global)throw 0;doc=d.doc;assets=d.assets||{};doc.frame=clone(FRAME);doc.global=doc.global||{fontFamily:'Noto Sans KR'};doc.ts=Object.assign(clone(TD),doc.ts||{});st.page=0;st.sel=null;st.hist=[];st.hi=-1;snap();renderAll();save();toast('불러왔어요')}catch(e){toast('프로젝트 파일을 읽을 수 없어요')}};
  r.readAsText(f);
});

/* ---------- 모달 / 토스트 ---------- */
function closeModal(){$('#modal').hidden=true}
function modal(title,body,actions){
  $('#mt').textContent=title;$('#mb').innerHTML=body;const a=$('#ma');a.innerHTML='';
  (actions||[]).forEach(x=>{const b=document.createElement('button');b.className='pill '+(x.cls||'');b.textContent=x.label;b.onclick=()=>{closeModal();x.fn&&x.fn()};a.appendChild(b)});
  $('#modal').hidden=false;
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- 내보내기: 1080 x 1080 PNG / ZIP ---------- */
function holder(){let h=$('#xhold');if(!h){h=document.createElement('div');h.id='xhold';h.style.cssText='position:fixed;left:-20000px;top:0;width:1080px;height:1350px;pointer-events:none';document.body.appendChild(h)}return h}
const waitImgs=root=>Promise.all([...root.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
function plain(h){const t=document.createElement('template');t.innerHTML=h||'';return t.content.textContent}
function allText(){
  let s='0123456789 .,:;!?-–—()[]{}/\\\'"~@#%&*+=<>·…‘’“”통계'+doc.header.blogName;
  doc.pages.forEach(p=>p.blocks.forEach(b=>{s+=plain(b.html)+Object.keys(b).filter(k=>!['html','id','type','assetId','avatarId','style'].includes(k)&&typeof b[k]==='string').map(k=>b[k]).join('')}));
  s+='나도 궁금해요댓글비공개채택률조회수#'+Object.values(doc.dict||{}).filter(v=>typeof v==='string').join('');
  return[...new Set(s)].join('');
}
function usedFamilies(){
  const set=new Set([UIFONT]);
  doc.pages.forEach(p=>p.blocks.forEach(b=>{if(FREE_FONT.includes(b.type))set.add(rs(b).ff||'Noto Sans KR')}));
  return[...set].filter(n=>FONTS.some(f=>f.name===n));
}
async function loadFonts(){
  const txt=allText();
  await Promise.all(usedFamilies().flatMap(fam=>[300,400,500,700].map(w=>document.fonts.load(w+' 40px "'+fam+'"',txt))));
  await document.fonts.ready;
}
const fcache={};
async function buildFontCSS(){
  const fams=usedFamilies(),txt=allText(),key=fams.join(',')+'|'+txt;if(fcache[key])return fcache[key];
  const spec=fams.map(n=>'family='+FONTS.find(f=>f.name===n).css).join('&');
  const css=await(await fetch('https://fonts.googleapis.com/css2?'+spec+'&text='+encodeURIComponent(txt)+'&display=swap')).text();
  const urls=[...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))];
  let out=css;
  for(const u of urls){
    const blob=await(await fetch(u)).blob();
    const d=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob)});
    out=out.split(u).join(d);
  }
  return fcache[key]=out;
}
async function preflight(idxs){
  const w=[],h=holder();
  for(const i of idxs){
    const p=doc.pages[i],empty=p.blocks.filter(b=>b.type==='image'&&!(b.assetId&&assets[b.assetId])).length;
    if(empty)w.push((i+1)+'페이지: 비어 있는 이미지 블록 '+empty+'개');
    const n=renderPage(p,'export');h.appendChild(n);await waitImgs(n);
    if(pageOverflow(n))w.push((i+1)+'페이지: 내용이 아래로 넘쳐 잘려요');
    h.removeChild(n);
  }
  return w;
}
async function renderToBlob(p,fontCSS,warm){
  const h=holder(),n=renderPage(p,'export');h.appendChild(n);await waitImgs(n);
  const opt={width:W,height:H,pixelRatio:1,backgroundColor:doc.frame.bg};
  if(fontCSS)opt.fontEmbedCSS=fontCSS;
  try{if(warm)await htmlToImage.toBlob(n,opt);return await htmlToImage.toBlob(n,opt)}finally{h.removeChild(n)}
}
async function exportPages(idxs){
  if(!window.htmlToImage||!window.JSZip){toast('내보내기 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하세요');return}
  modal('내보내는 중','<p id="mp">폰트와 이미지를 확인하고 있어요…</p>',[]);
  const prog=t=>{const e=$('#mp');if(e)e.textContent=t};
  try{
    await loadFonts();
    const w=await preflight(idxs);
    if(w.length){
      const go=await new Promise(res=>modal('내보내기 전에 확인하세요','<ul>'+w.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>',[{label:'취소',fn:()=>res(false)},{label:'그래도 내보내기',cls:'dark',fn:()=>res(true)}]));
      if(!go)return;
      modal('내보내는 중','<p id="mp"></p>',[]);
    }
    let fontCSS;
    try{prog('글꼴을 포함하는 중…');fontCSS=await buildFontCSS()}catch(e){console.warn(e);toast('글꼴 포함에 실패해 기본 글꼴로 나올 수 있어요')}
    const files=[];
    for(let k=0;k<idxs.length;k++){
      prog((k+1)+' / '+idxs.length+' 페이지 만드는 중…');
      const blob=await renderToBlob(doc.pages[idxs[k]],fontCSS,k===0);
      files.push({name:'carousel_'+String(idxs[k]+1).padStart(2,'0')+'.png',blob});
    }
    if(files.length===1)download(files[0].blob,files[0].name);
    else{const z=new JSZip();files.forEach(f=>z.file(f.name,f.blob));download(await z.generateAsync({type:'blob'}),'carousel.zip')}
    closeModal();toast('내보내기 완료 · '+W+'×'+H+'px');
  }catch(err){
    console.error(err);
    modal('내보내기에 실패했어요','<p>'+esc(err&&err.message||String(err))+'</p>',[{label:'닫기'}]);
  }
}

/* ---------- 시작 ---------- */
document.execCommand('defaultParagraphSeparator',false,'div');
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const d=JSON.parse(raw);if(d.doc&&d.doc.pages&&d.doc.pages.length&&d.doc.frame){doc=d.doc;assets=d.assets||{}}}
}catch(e){}
if(!doc)doc=defaultDoc();
doc.frame=clone(FRAME);
doc.ts=Object.assign(clone(TD),doc.ts||{});
snap();renderAll();
requestAnimationFrame(()=>{
  const s=$('#stage');st.zoom=Math.max(.25,Math.min(1,(s.clientHeight-48)/H,(s.clientWidth-48)/W));applyZoom();
});
})();
